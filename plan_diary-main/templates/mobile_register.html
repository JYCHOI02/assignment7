<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트폰 지문(패스키) 등록 — 플랜두씨 다이어리</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: #f4f6f0;
            padding: 24px 16px;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
        }
        .reg-card {
            background: #fff;
            border: 1px solid #dcd8c8;
            border-radius: 18px;
            padding: 32px 22px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon-circle {
            width: 68px;
            height: 68px;
            background: #e8f5ec;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            border: 2px solid #a3e6ba;
        }
        .reg-title {
            font-family: 'Gowun Batang', serif;
            font-size: 22px;
            font-weight: 700;
            color: #2b2a28;
            margin: 0 0 8px;
        }
        .reg-desc {
            font-size: 13.5px;
            color: #63604f;
            line-height: 1.55;
            margin: 0 0 20px;
        }
        .user-highlight-box {
            background: #f8faf5;
            border: 1.5px dashed #4c7a5e;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 22px;
            font-size: 13.5px;
            color: #2e543c;
            text-align: center;
        }
        .user-highlight-box strong {
            font-size: 16px;
            color: #1b432a;
        }
        .reg-btn {
            width: 100%;
            padding: 16px;
            background: #2e543c;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(46, 84, 60, 0.28);
            transition: transform 0.1s, background 0.2s;
        }
        .reg-btn:disabled {
            background: #aaa;
            box-shadow: none;
            cursor: not-allowed;
        }
        .reg-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .result-box {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.55;
        }
        .result-box.success {
            background: #edf7ed;
            color: #2e543c;
            border: 1px solid #b7eb8f;
        }
        .result-box.error {
            background: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
        }
    </style>
</head>
<body>

<div class="reg-card">
    {% if error %}
        <div class="icon-circle" style="background: #fde8e8; border-color: #f8b4b4;">⚠️</div>
        <h1 class="reg-title">등록 오류</h1>
        <p class="reg-desc">{{ error }}</p>
    {% else %}
        <div class="icon-circle">📱</div>
        <h1 class="reg-title">스마트폰 지문 등록</h1>
        <p class="reg-desc">
            컴퓨터(PC) 화면의 플랜두씨 다이어리 계정에<br>
            현재 스마트폰의 <b>지문 / Face ID</b>를 등록합니다.
        </p>

        <div class="user-highlight-box">
            등록할 컴퓨터 계정: <strong>{{ username }}</strong>
        </div>

        <div id="regFormArea">
            <button type="button" class="reg-btn" id="regBtn" onclick="handleMobilePasskeyRegister()">
                <span>👆</span>
                <span>지금 내 스마트폰 지문 등록하기</span>
            </button>
            <p style="font-size: 11.5px; color: #888; margin: 12px 0 0 0; line-height: 1.4;">
                🔒 등록 시 스마트폰 브라우저의 생체인식 팝업이 호출됩니다.
            </p>
        </div>

        <div id="resultBox" class="result-box"></div>
    {% endif %}
</div>

<script>
    const regToken = "{{ token }}";

    function b64urlToBuffer(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = '='.repeat((4 - (b64.length % 4)) % 4);
        const bin = atob(b64 + pad);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }

    function bufferToB64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let bin = '';
        for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function handleMobilePasskeyRegister() {
        const btn = document.getElementById('regBtn');
        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'none';

        if (!window.PublicKeyCredential) {
            alert('현재 스마트폰 브라우저가 생체인증(WebAuthn/Passkey)을 지원하지 않습니다.');
            return;
        }

        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span>⌛</span><span>스마트폰 지문 센서 대기 중...</span>';

        try {
            // 1. 서버에 등록 옵션 요청
            const optRes = await fetch('/api/auth/passkey/mobile-reg-options', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({ token: regToken })
            });
            const options = await optRes.json();

            if (!optRes.ok || options.success === false) {
                throw new Error(options.message || '등록 옵션 발급 실패');
            }

            // 2. 바이너리 변환
            options.challenge = b64urlToBuffer(options.challenge);
            options.user.id = b64urlToBuffer(options.user.id);

            // 3. 브라우저 지문 / Face ID 팝업 실행!
            const credential = await navigator.credentials.create({ publicKey: options });

            // 4. 서명 공개키 서버 전송 및 등록 완료
            const verifyRes = await fetch('/api/auth/passkey/mobile-reg-verify', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({
                    token: regToken,
                    device_name: '내 스마트폰 (' + (navigator.userAgent.includes('iPhone') ? 'iPhone' : 'Android') + ')',
                    response: {
                        attestationObject: bufferToB64url(credential.response.attestationObject),
                        clientDataJSON: bufferToB64url(credential.response.clientDataJSON)
                    }
                })
            });

            const verifyData = await verifyRes.json();

            if (verifyRes.ok && verifyData.success) {
                document.getElementById('regFormArea').style.display = 'none';
                resBox.className = 'result-box success';
                resBox.innerHTML = '<h3>🎉 생체인증(패스키) 등록 완료!</h3><p>스마트폰 지문이 성공적으로 등록되었습니다.<br><b>이제 컴퓨터(PC) 화면을 확인해 주세요!</b></p>';
                resBox.style.display = 'block';
            } else {
                throw new Error(verifyData.message || '등록 검증 실패');
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = origText;
            if (err.name === 'NotAllowedError') {
                alert('지문 등록이 취소되었거나 거절되었습니다.');
            } else {
                alert('등록 오류: ' + (err.message || err));
            }
        }
    }
</script>

</body>
</html>

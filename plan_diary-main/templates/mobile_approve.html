<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컴퓨터 로그인 승인 — 플랜두씨 다이어리</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: #f4f6f0;
            padding: 20px 16px;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .approve-card {
            background: #fff;
            border: 1px solid #dcd8c8;
            border-radius: 16px;
            padding: 28px 22px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .device-icon-wrap {
            width: 64px;
            height: 64px;
            background: #eaf2ed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 16px;
            border: 2px solid #b7eb8f;
        }
        .approve-title {
            font-family: 'Gowun Batang', serif;
            font-size: 22px;
            font-weight: 700;
            color: #2b2a28;
            margin: 0 0 8px;
        }
        .approve-desc {
            font-size: 13px;
            color: #63604f;
            line-height: 1.5;
            margin: 0 0 20px;
        }
        .account-select-box {
            background: #f9faf5;
            border: 1px solid #e2ded0;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: left;
        }
        .account-select-box label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 6px;
        }
        .account-select-box select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            background: #fff;
        }
        .status-badge-area {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-ready {
            color: #2e543c;
        }
        .badge-unregistered {
            color: #b23a3a;
        }
        .approve-btn {
            width: 100%;
            padding: 16px;
            background: #2e543c;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(46, 84, 60, 0.25);
            transition: transform 0.1s, background 0.2s;
        }
        .approve-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }
        .approve-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .reject-btn {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #888;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }
        .result-box {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        .result-box.success {
            background: #edf7ed;
            color: #2e543c;
            border: 1px solid #b7eb8f;
        }
        .result-box.error {
            background: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
        }
    </style>
</head>
<body>

<div class="approve-card">
    <div class="device-icon-wrap">💻</div>
    <h1 class="approve-title">컴퓨터 로그인 요청</h1>
    <p class="approve-desc">모니터 화면에 표시된 플랜두씨 다이어리에서<br>로그인 승인을 요청했습니다.</p>

    <div id="approveFormArea">
        <div class="account-select-box">
            <label for="usernameSelect">승인할 계정 선택</label>
            <select id="usernameSelect" onchange="checkPasskeyStatus()">
                {% for u in users %}
                <option value="{{ u.username }}" data-has-passkey="{{ '1' if u.has_passkey else '0' }}" {% if u.username == 'admin' %}selected{% endif %}>
                    {{ u.username }} {% if not u.has_passkey %}(패스키 미등록){% endif %}
                </option>
                {% endfor %}
            </select>

            <div id="passkeyBadge" class="status-badge-area"></div>
        </div>

        <button type="button" class="approve-btn" id="approveBtn" onclick="handleMobileApprove()">
            <span>👆</span>
            <span>지문 / Face ID로 컴퓨터 승인</span>
        </button>

        <button type="button" class="reject-btn" onclick="window.close();">거절 및 닫기</button>
    </div>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    const qrToken = "{{ token }}";

    function b64urlToBuffer(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = '='.repeat((4 - (b64.length % 4)) % 4);
        const bin = atob(b64 + pad);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }

    function bufferToB64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let bin = '';
        for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function checkPasskeyStatus() {
        const sel = document.getElementById('usernameSelect');
        const opt = sel.options[sel.selectedIndex];
        const hasPasskey = opt.getAttribute('data-has-passkey') === '1';
        const badge = document.getElementById('passkeyBadge');
        const btn = document.getElementById('approveBtn');

        if (hasPasskey) {
            badge.className = 'status-badge-area badge-ready';
            badge.innerHTML = '🔒 등록된 패스키 기기 확인됨 (지문 승인 가능)';
            btn.disabled = false;
        } else {
            badge.className = 'status-badge-area badge-unregistered';
            badge.innerHTML = '⚠️ 등록된 패스키가 없는 계정입니다.<br><small style="font-weight:normal;color:#666;">먼저 해당 계정으로 로그인하여 [패스키 등록]을 해야만 지문 승인이 가능합니다.</small>';
            btn.disabled = true;
        }
    }

    async function handleMobileApprove() {
        const username = document.getElementById('usernameSelect').value;
        const btn = document.getElementById('approveBtn');
        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'none';

        if (!window.PublicKeyCredential) {
            alert('현재 스마트폰 브라우저가 생체인증(WebAuthn)을 지원하지 않습니다.');
            return;
        }

        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span>⌛</span><span>스마트폰 지문 인식 중...</span>';

        try {
            // 1. 서버에 스마트폰 지문인증용 WebAuthn Assertion 챌린지 요청
            const optRes = await fetch('/api/auth/qr/approve-options', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: qrToken, username: username })
            });
            const optData = await optRes.json();

            if (!optRes.ok || !optData.success) {
                throw new Error(optData.message || '승인 옵션 생성 실패');
            }

            // 2. 바이너리 버퍼 변환
            optData.challenge = b64urlToBuffer(optData.challenge);
            if (optData.allowCredentials && optData.allowCredentials.length > 0) {
                optData.allowCredentials = optData.allowCredentials.map(c => ({
                    ...c,
                    id: b64urlToBuffer(c.id)
                }));
            }

            // 3. 스마트폰 화면에 진짜 지문 / Face ID 팝업 띄우기!
            const assertion = await navigator.credentials.get({ publicKey: optData });

            // 4. 추출된 암호학적 전자서명을 서버로 전송하여 최종 승인
            const verifyRes = await fetch('/api/auth/qr/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: qrToken,
                    username: username,
                    id: assertion.id,
                    response: {
                        authenticatorData: bufferToB64url(assertion.response.authenticatorData),
                        clientDataJSON: bufferToB64url(assertion.response.clientDataJSON),
                        signature: bufferToB64url(assertion.response.signature)
                    }
                })
            });

            const verifyData = await verifyRes.json();

            if (verifyRes.ok && verifyData.success) {
                document.getElementById('approveFormArea').style.display = 'none';
                resBox.className = 'result-box success';
                resBox.innerHTML = '<h3>🎉 지문 서명 검증 성공!</h3><p>컴퓨터(PC) 화면이 <b>' + username + '</b>님으로 자동 로그인되었습니다.<br>모니터 화면을 확인해 주세요!</p>';
                resBox.style.display = 'block';
            } else {
                throw new Error(verifyData.message || '지문 서명 검증 실패');
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = origText;
            if (err.name === 'NotAllowedError') {
                alert('지문 인식이 취소되었거나 거절되었습니다.');
            } else {
                alert('승인 오류: ' + (err.message || err));
            }
        }
    }

    // 초기 상태 체크
    window.addEventListener('DOMContentLoaded', checkPasskeyStatus);
</script>

</body>
</html>

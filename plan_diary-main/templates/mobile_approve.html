<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컴퓨터 로그인 승인 — 플랜두씨 다이어리</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: #f4f6f0;
            padding: 20px 16px;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .approve-card {
            background: #fff;
            border: 1px solid #dcd8c8;
            border-radius: 16px;
            padding: 28px 22px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .device-icon-wrap {
            width: 64px;
            height: 64px;
            background: #eaf2ed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 16px;
            border: 2px solid #b7eb8f;
        }
        .approve-title {
            font-family: 'Gowun Batang', serif;
            font-size: 22px;
            font-weight: 700;
            color: #2b2a28;
            margin: 0 0 8px;
        }
        .approve-desc {
            font-size: 13px;
            color: #63604f;
            line-height: 1.5;
            margin: 0 0 20px;
        }
        .account-select-box {
            background: #f9faf5;
            border: 1px solid #e2ded0;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: left;
        }
        .account-select-box label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #2b2a28;
            margin-bottom: 8px;
        }
        .account-select-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1.5px solid #dcd8c8;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .account-select-box input:focus {
            border-color: #2e543c;
            box-shadow: 0 0 0 3px rgba(46, 84, 60, 0.15);
        }
        .approve-btn {
            width: 100%;
            padding: 16px;
            background: #2e543c;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(46, 84, 60, 0.25);
            transition: transform 0.1s, background 0.2s;
        }
        .approve-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }
        .approve-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .reject-btn {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #888;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }
        .result-box {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        .result-box.success {
            background: #edf7ed;
            color: #2e543c;
            border: 1px solid #b7eb8f;
        }
        .result-box.error {
            background: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
        }
    </style>
</head>
<body>

<div class="approve-card">
    <div class="device-icon-wrap">💻</div>
    <h1 class="approve-title">컴퓨터 로그인 요청</h1>
    <p class="approve-desc">모니터 화면에 표시된 플랜두씨 다이어리에서<br>로그인 승인을 요청했습니다.</p>

    <div id="approveFormArea">
        <div class="account-select-box">
            <label for="usernameInput">로그인할 아이디 입력</label>
            <input type="text" id="usernameInput" placeholder="아이디를 입력하세요" autocomplete="username" autofocus>
        </div>

        <button type="button" class="approve-btn" id="approveBtn" onclick="handleMobileApprove()">
            <span>👆</span>
            <span>지문 / Face ID로 컴퓨터 승인</span>
        </button>

        <button type="button" class="reject-btn" onclick="window.close();">거절 및 닫기</button>

        <!-- 💡 [원클릭 지문 등록 & 즉시 컴퓨터 로그인] 섹션 -->
        <div id="quickRegSection" style="margin-top: 18px; background: #fafaf5; border: 1.5px dashed #4c7a5e; border-radius: 12px; padding: 14px 16px; text-align: left;">
            <div style="font-size: 13.5px; font-weight: 700; color: #2e543c; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
                <span>📱 이 폰 지문 신규 등록 & 컴퓨터 로그인</span>
                <span style="font-size: 11px; background: #eaf2ed; color: #2e543c; padding: 2px 8px; border-radius: 10px; font-weight: 600;">1초 등록</span>
            </div>
            <p id="quickRegNotice" style="font-size: 12px; color: #555; margin: 0 0 10px; line-height: 1.45;">
                스마트폰에 <b>"~에서 사용 가능한 로그인 정보 없음"</b>이 뜨거나 처음이신가요?<br>
                비밀번호로 1회 확인 후 지문을 등록하시면 <b>컴퓨터도 즉시 자동 로그인</b>됩니다!
            </p>
            <div style="margin-bottom: 10px;">
                <input type="password" id="regPasswordInput" placeholder="계정 비밀번호 입력 (예: admin1234!)" style="width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1.5px solid #dcd8c8; border-radius: 8px; font-size: 14px; outline: none; background: #fff; transition: all 0.2s;">
            </div>
            <button type="button" class="approve-btn" id="quickRegBtn" onclick="handleQuickRegisterAndApprove()" style="background: #3b6d4e; font-size: 14px; padding: 13px;">
                <span>👆</span>
                <span>지금 이 폰 지문 등록 & 컴퓨터 로그인</span>
            </button>
        </div>
    </div>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    const qrToken = "{{ token }}".trim();

    // QR 토큰 누락 시 즉시 안내 표시
    if (!qrToken) {
        document.getElementById('approveFormArea').style.display = 'none';
        const resBox = document.getElementById('resultBox');
        resBox.className = 'result-box error';
        resBox.innerHTML = '<h3>⚠️ QR 세션 정보가 없습니다</h3><p>컴퓨터 화면의 QR 코드를 스마트폰 카메라로 다시 스캔해 주세요.<br>(주소창에 ?token= 정보가 포함되어 있어야 컴퓨터와 연동됩니다)</p>';
        resBox.style.display = 'block';
    }

    function b64urlToBuffer(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = '='.repeat((4 - (b64.length % 4)) % 4);
        const bin = atob(b64 + pad);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }

    function bufferToB64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let bin = '';
        for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    async function handleMobileApprove() {
        const usernameInput = document.getElementById('usernameInput');
        const username = usernameInput ? usernameInput.value.trim() : '';
        const btn = document.getElementById('approveBtn');
        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'none';

        if (!qrToken) {
            alert('유효한 QR 토큰 정보가 없습니다. 컴퓨터 화면의 QR 코드를 다시 스캔해 주세요.');
            return;
        }

        if (!username) {
            alert('로그인할 아이디를 입력해 주세요.');
            if (usernameInput) usernameInput.focus();
            return;
        }

        if (!window.PublicKeyCredential) {
            alert('현재 스마트폰 브라우저가 생체인증(WebAuthn)을 지원하지 않습니다.');
            return;
        }

        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span>⌛</span><span>스마트폰 지문 인식 중...</span>';

        try {
            // 1. 서버에 스마트폰 지문인증용 WebAuthn Assertion 챌린지 요청
            const optRes = await fetch('/api/auth/qr/approve-options', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({ token: qrToken, username: username })
            });
            const optData = await optRes.json();

            if (!optRes.ok || !optData.success) {
                let msg = optData.message || '승인 옵션 생성 실패';
                const passInput = document.getElementById('regPasswordInput');
                if (passInput) {
                    passInput.focus();
                    passInput.style.borderColor = '#2e543c';
                    passInput.style.boxShadow = '0 0 0 3px rgba(46,84,60,0.2)';
                }
                throw new Error(msg);
            }

            // 2. 바이너리 버퍼 변환
            optData.challenge = b64urlToBuffer(optData.challenge);
            if (optData.allowCredentials && optData.allowCredentials.length > 0) {
                optData.allowCredentials = optData.allowCredentials.map(c => ({
                    ...c,
                    id: b64urlToBuffer(c.id)
                }));
            }

            // 3. 스마트폰 화면에 진짜 지문 / Face ID 팝업 띄우기!
            const assertion = await navigator.credentials.get({ publicKey: optData });

            // 4. 추출된 암호학적 전자서명을 서버로 전송하여 최종 승인
            const verifyRes = await fetch('/api/auth/qr/approve', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({
                    token: qrToken,
                    username: username,
                    id: assertion.id,
                    response: {
                        authenticatorData: bufferToB64url(assertion.response.authenticatorData),
                        clientDataJSON: bufferToB64url(assertion.response.clientDataJSON),
                        signature: bufferToB64url(assertion.response.signature)
                    }
                })
            });

            const verifyData = await verifyRes.json();

            if (verifyRes.ok && verifyData.success) {
                document.getElementById('approveFormArea').style.display = 'none';
                resBox.className = 'result-box success';
                resBox.innerHTML = '<h3>🎉 지문 서명 검증 성공!</h3><p>컴퓨터(PC) 화면이 <b>' + escapeHtml(username) + '</b>님으로 자동 로그인되었습니다.<br>모니터 화면을 확인해 주세요!</p>';
                resBox.style.display = 'block';
            } else {
                throw new Error(verifyData.message || '지문 서명 검증 실패');
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = origText;

            const passInput = document.getElementById('regPasswordInput');
            if (passInput) {
                passInput.focus();
                passInput.style.borderColor = '#c1512e';
                passInput.style.boxShadow = '0 0 0 3px rgba(193, 81, 46, 0.2)';
            }

            resBox.className = 'result-box error';
            resBox.style.display = 'block';

            if (err.name === 'NotAllowedError') {
                resBox.innerHTML = '<h3>💡 현재 도메인에 저장된 지문이 없습니다</h3><p>스마트폰에 <b>"' + location.hostname + '에서 사용 가능한 로그인 정보 없음"</b>이 표시되었나요?<br>WebAuthn 표준상 접속 주소(도메인)마다 지문을 1회 등록해야 합니다.<br>👉 <b>아래 비밀번호 입력란에 비밀번호를 넣고 [지금 이 폰 지문 등록 & 컴퓨터 로그인]</b>을 터치해 주세요!</p>';
            } else {
                resBox.innerHTML = '<h3>⚠️ 지문 확인 안내</h3><p>' + escapeHtml(err.message || err) + '<br>👉 <b>아래에서 비밀번호를 입력하여 새 지문을 즉시 등록</b>할 수 있습니다.</p>';
            }
        }
    }

    async function handleQuickRegisterAndApprove() {
        const usernameInput = document.getElementById('usernameInput');
        const username = usernameInput ? usernameInput.value.trim() : '';
        const passwordInput = document.getElementById('regPasswordInput');
        const password = passwordInput ? passwordInput.value : '';
        const btn = document.getElementById('quickRegBtn');
        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'none';

        if (!qrToken) {
            alert('유효한 QR 토큰 정보가 없습니다. 컴퓨터 화면의 QR 코드를 다시 스캔해 주세요.');
            return;
        }

        if (!username) {
            alert('로그인할 아이디를 입력해 주세요.');
            if (usernameInput) usernameInput.focus();
            return;
        }

        if (!password) {
            alert('계정 비밀번호를 입력해 주세요.');
            if (passwordInput) passwordInput.focus();
            return;
        }

        if (!window.PublicKeyCredential) {
            alert('현재 스마트폰 브라우저가 생체인증(WebAuthn/Passkey)을 지원하지 않습니다.');
            return;
        }

        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span>⌛</span><span>스마트폰 지문 센서 대기 중...</span>';

        try {
            // 1. 등록 옵션 요청 (서버에서 비밀번호 검증 후 WebAuthn create 챌린지 발급)
            const optRes = await fetch('/api/auth/qr/quick-register-options', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({
                    token: qrToken,
                    username: username,
                    password: password
                })
            });

            const optData = await optRes.json();
            if (!optRes.ok || !optData.success) {
                throw new Error(optData.message || '등록 옵션 발급 실패');
            }

            // 2. 바이너리 버퍼 변환
            optData.challenge = b64urlToBuffer(optData.challenge);
            optData.user.id = b64urlToBuffer(optData.user.id);

            // 3. 브라우저 생체인증(지문/Face ID) 등록 팝업 실행!
            const credential = await navigator.credentials.create({ publicKey: optData });

            // 4. 추출된 암호학적 attestation을 서버로 전송하여 DB 저장 + 컴퓨터 즉시 승인!
            const verifyRes = await fetch('/api/auth/qr/quick-register-verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({
                    token: qrToken,
                    username: username,
                    id: credential.id,
                    response: {
                        attestationObject: bufferToB64url(credential.response.attestationObject),
                        clientDataJSON: bufferToB64url(credential.response.clientDataJSON)
                    }
                })
            });

            const verifyData = await verifyRes.json();
            if (verifyRes.ok && verifyData.success) {
                document.getElementById('approveFormArea').style.display = 'none';
                resBox.className = 'result-box success';
                resBox.innerHTML = '<h3>🎉 지문 등록 및 컴퓨터 로그인 성공!</h3><p>스마트폰 지문이 현재 도메인에 안전하게 등록되었으며,<br>컴퓨터(PC) 화면이 <b>' + escapeHtml(username) + '</b>님으로 자동 로그인되었습니다!<br>모니터 화면을 확인해 주세요.</p>';
                resBox.style.display = 'block';
            } else {
                throw new Error(verifyData.message || '지문 등록 검증 실패');
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = origText;
            if (err.name === 'NotAllowedError') {
                alert('지문 등록이 취소되었거나 거절되었습니다.');
            } else {
                alert('등록 오류: ' + (err.message || err));
            }
        }
    }

    // Enter 키 입력 시 승인 실행
    document.getElementById('usernameInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleMobileApprove();
        }
    });

    document.getElementById('regPasswordInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleQuickRegisterAndApprove();
        }
    });
</script>

</body>
</html>
